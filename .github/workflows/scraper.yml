name: Auto COD Scraper

on:
  schedule:
    - cron: '0 0 * * 0' # اجرای خودکار هر یکشنبه
  workflow_dispatch: # امکان اجرای دستی

# دسترسی لازم برای Commit و Push کردن به ریپازیتوری
permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          if [ -d "backend" ]; then cd backend; fi
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi

      - name: Run Scraper Script
        run: |
          if [ -d "backend" ]; then cd backend; fi
          python scraper.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # اضافه کردن فایل‌های تغییر یافته (چه داخل پوشه backend چه ریشه)
          git add .
          
          # چک کردن اینکه آیا تغییری ایجاد شده یا نه
          if git diff --staged --quiet; then
            echo "هیچ تغییر جدیدی در داده‌ها یافت نشد."
          else
            git commit -m "Auto update meta weapons data [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
